name: Docker Build & Push

on:
  push:
    branches: [main, staging]
    tags: ["v*"]

permissions: {} # Default: no permissions. Jobs declare what they need.

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/codeforge

jobs:
  # A v* tag releases the version in VERSION (KI-116): it must name that
  # version and point at a commit on main, else nothing is built. Such a tag
  # (not a prerelease) builds the images as <version>, <major>.<minor> and
  # "latest"; docker-compose.prod.yml pins <version> (scripts/sync-version.sh).
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the history of main, for the ancestry check

      - name: Check the release tag
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not name the version in VERSION ($version)"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG does not point at a commit on main"
            exit 1
          fi
          case "$version" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; # a prerelease
            *) echo "latest=true" >> "$GITHUB_OUTPUT" ;;
          esac

  build-core:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write # the SLSA provenance step stores its attestation
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read VERSION file
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-core
          # Branch pushes: the branch name and the commit SHA. The version
          # tags and "latest" come only from a release tag (release job).
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ needs.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The scan pulls exactly this push by digest; registry paths must be
      # lowercase and the repository owner may not be.
      - name: Record pushed image reference
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-core
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-core
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-worker:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write # the SLSA provenance step stores its attestation
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read VERSION file
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
          # Branch pushes: the branch name and the commit SHA. The version
          # tags and "latest" come only from a release tag (release job).
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ needs.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The scan pulls exactly this push by digest; registry paths must be
      # lowercase and the repository owner may not be.
      - name: Record pushed image reference
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-frontend:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write # the SLSA provenance step stores its attestation
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read VERSION file
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          # Branch pushes: the branch name and the commit SHA. The version
          # tags and "latest" come only from a release tag (release job).
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ needs.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The scan pulls exactly this push by digest; registry paths must be
      # lowercase and the repository owner may not be.
      - name: Record pushed image reference
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan-images:
    name: Grype Image Scan (${{ matrix.name }})
    needs: [build-core, build-worker, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codeforge-core
            image: ${{ needs.build-core.outputs.image }}
          - name: codeforge-worker
            image: ${{ needs.build-worker.outputs.image }}
          - name: codeforge-frontend
            image: ${{ needs.build-frontend.outputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Grype
        uses: anchore/scan-action@869c549e657a088dc0441b08ce4fc0ecdac2bb65 # v5
        id: scan
        with:
          image: ${{ matrix.image }}
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3 # v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
