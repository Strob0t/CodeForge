# Production Docker Compose for CodeForge
# Usage:
#   ./scripts/generate-secrets.sh ./secrets   # once; creates the files listed under "secrets:"
#   ./scripts/validate-env.sh                  # pre-flight check of the secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# Secret Management:
#   Secrets are Docker secret files from ${SECRETS_DIR:-./secrets}, mounted at
#   /run/secrets/<name>. Services get the file paths (*_FILE), never the values,
#   so no secret appears in the compose environment or in `docker inspect`.
#   The Go core reads *_FILE natively; postgres uses the image's
#   POSTGRES_PASSWORD_FILE; nats reads its credentials from a config file;
#   litellm and the worker export their secrets from the files in a small
#   entrypoint wrapper.
#   Compose bind-mounts the files with their host owner and mode (uid/gid/mode
#   are Swarm-only), so they must be readable by the non-root container users:
#   generate-secrets.sh writes them 0644 inside a 0700 directory.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  # --- Infrastructure ---

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres-password
      - postgres-tls-cert
      - postgres-tls-key
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeforge}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: ${POSTGRES_DB:-codeforge}
    # PostgreSQL 18+ images keep PGDATA in /var/lib/postgresql/18/docker and
    # refuse to start with a mount at /var/lib/postgresql/data: mount the parent.
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_archive:/archive
    tmpfs:
      - /run/postgresql-tls:size=1m
    # Runs as root before the image entrypoint drops to the postgres user:
    # PostgreSQL only accepts a private key owned by its user with mode 0600,
    # and the archive volume is created root-owned.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        chown postgres:postgres /run/postgresql-tls /archive
        chmod 0700 /run/postgresql-tls /archive
        install -m 0644 -o postgres -g postgres /run/secrets/postgres-tls-cert /run/postgresql-tls/server.crt
        install -m 0600 -o postgres -g postgres /run/secrets/postgres-tls-key /run/postgresql-tls/server.key
        exec docker-entrypoint.sh "$$@"
      - postgres-entrypoint
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "log_line_prefix=%t [%p] %q%u@%d "
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/run/postgresql-tls/server.crt"
      - "-c"
      - "ssl_key_file=/run/postgresql-tls/server.key"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test ! -f /archive/%f && cp %p /archive/%f"
      - "-c"
      - "archive_timeout=300"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging: *default-logging

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - nats-auth-conf
    # The config file only holds the authorization block (user and password).
    command:
      - "--config"
      - "/run/secrets/nats-auth-conf"
      - "--jetstream"
      - "--store_dir"
      - "/data"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "echo | nc -z localhost 4222"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: *default-logging

  litellm:
    image: ghcr.io/berriai/litellm:v1.103.1
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - litellm-master-key
      - database-url
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CHUTES_API_KEY: ${CHUTES_API_KEY:-}
      AIHUBMIX_API_KEY: ${AIHUBMIX_API_KEY:-}
      LM_STUDIO_API_BASE: ${LM_STUDIO_API_BASE:-http://host.docker.internal:1234/v1}
      OLLAMA_API_BASE: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./litellm:/app/data:ro
    # The local model servers default to the host; Linux needs the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # LiteLLM reads its master key and database URL only from the environment.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        LITELLM_MASTER_KEY="$$(cat /run/secrets/litellm-master-key)"
        DATABASE_URL="$$(cat /run/secrets/database-url)"
        export LITELLM_MASTER_KEY DATABASE_URL
        exec docker/prod_entrypoint.sh "$$@"
      - litellm-entrypoint
    command: ["--config", "/app/data/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # "internal" has no route out; LiteLLM needs "egress" to reach the LLM
    # providers (and local model servers via host.docker.internal).
    networks:
      - internal
      - egress
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging: *default-logging

  # --- Application ---

  core:
    image: ${CORE_IMAGE:-ghcr.io/strob0t/codeforge-core:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    secrets:
      - database-url
      - nats-url
      - litellm-master-key
      - codeforge-auth-jwt-secret
      - codeforge-auth-llm-key-encryption-secret
      - codeforge-internal-key
    environment:
      APP_ENV: production
      CODEFORGE_PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/database-url
      NATS_URL_FILE: /run/secrets/nats-url
      LITELLM_BASE_URL: "http://litellm:4000"
      LITELLM_MASTER_KEY_FILE: /run/secrets/litellm-master-key
      CODEFORGE_AUTH_JWT_SECRET_FILE: /run/secrets/codeforge-auth-jwt-secret
      CODEFORGE_AUTH_LLM_KEY_ENCRYPTION_SECRET_FILE: /run/secrets/codeforge-auth-llm-key-encryption-secret
      CODEFORGE_INTERNAL_KEY_FILE: /run/secrets/codeforge-internal-key
      CODEFORGE_WORKSPACE_ROOT: /data/workspaces
      CODEFORGE_AUTH_INITIAL_PASSWORD_FILE: /data/initial_admin_password
    # The root filesystem stays read-only: /data (initial admin password, the
    # OAuth .env next to the workspace root) and the workspaces shared with the
    # worker are volumes, /tmp is a tmpfs.
    volumes:
      - core_data:/data
      - workspaces:/data/workspaces
    tmpfs:
      - /tmp
    ports:
      - "${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    logging: *default-logging

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/strob0t/codeforge-worker:latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    secrets:
      - database-url
      - nats-url
      - litellm-master-key
      - codeforge-internal-key
    environment:
      APP_ENV: production
      LITELLM_BASE_URL: "http://litellm:4000"
      CODEFORGE_CORE_URL: "http://core:8080"
    # The worker reads these settings only from the environment.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        DATABASE_URL="$$(cat /run/secrets/database-url)"
        NATS_URL="$$(cat /run/secrets/nats-url)"
        LITELLM_MASTER_KEY="$$(cat /run/secrets/litellm-master-key)"
        CODEFORGE_INTERNAL_KEY="$$(cat /run/secrets/codeforge-internal-key)"
        export DATABASE_URL NATS_URL LITELLM_MASTER_KEY CODEFORGE_INTERNAL_KEY
        exec python -m codeforge.consumer
    # Agent tools edit the workspaces in place, at the paths the core sends.
    volumes:
      - workspaces:/data/workspaces
    tmpfs:
      - /tmp
    depends_on:
      nats:
        condition: service_healthy
      litellm:
        condition: service_healthy
    # GET /health/ready on CODEFORGE_WORKER_HEALTH_PORT (default 8081): 200
    # while the worker is connected to NATS and every consumer loop runs.
    healthcheck:
      test: ["CMD", "python", "/app/scripts/worker-healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/strob0t/codeforge-frontend:latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - public
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging

secrets:
  postgres-password:
    file: ${SECRETS_DIR:-./secrets}/postgres-password
  postgres-tls-cert:
    file: ${SECRETS_DIR:-./secrets}/postgres-tls.crt
  postgres-tls-key:
    file: ${SECRETS_DIR:-./secrets}/postgres-tls.key
  database-url:
    file: ${SECRETS_DIR:-./secrets}/database-url
  nats-auth-conf:
    file: ${SECRETS_DIR:-./secrets}/nats-auth.conf
  nats-url:
    file: ${SECRETS_DIR:-./secrets}/nats-url
  litellm-master-key:
    file: ${SECRETS_DIR:-./secrets}/litellm-master-key
  codeforge-auth-jwt-secret:
    file: ${SECRETS_DIR:-./secrets}/codeforge-auth-jwt-secret
  codeforge-auth-llm-key-encryption-secret:
    file: ${SECRETS_DIR:-./secrets}/codeforge-auth-llm-key-encryption-secret
  codeforge-internal-key:
    file: ${SECRETS_DIR:-./secrets}/codeforge-internal-key

volumes:
  postgres_data:
  postgres_archive:
  nats_data:
  core_data:
  workspaces:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge
