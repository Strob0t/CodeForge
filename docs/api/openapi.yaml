      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Trajectory data
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        step:
                          type: integer
                        type:
                          type: string
                        tool_name:
                          type: string
                        input:
                          type: string
                        output:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        "404":
          $ref: "#/components/responses/NotFound"

