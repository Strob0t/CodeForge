openapi: "3.0.3"
info:
  title: CodeForge API
  description: |
    REST API for CodeForge -- AI coding agent orchestration platform.

    All endpoints under /api/v1 require a valid JWT bearer token unless
    explicitly marked as public (login, setup-status, health).

    Refresh tokens are delivered as httpOnly cookies on the /auth path.
  version: "0.8.0"
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: http://localhost:8080
    description: Local development (root, for /health)

tags:
  - name: Auth
    description: Authentication, user management, and API keys
  - name: Projects
    description: Project CRUD, workspace operations, and git management
  - name: Conversations
    description: Chat conversations and messages
  - name: Runs
    description: Agent execution runs, HITL approval, and trajectory
  - name: Settings
    description: Application settings (admin)
  - name: LLM
    description: LLM model management and health
  - name: Dashboard
    description: Dashboard statistics and charts
  - name: Health
    description: Service health and readiness checks
  - name: Costs
    description: Cost tracking and aggregation
  - name: GDPR
    description: GDPR data export and deletion
  - name: Modes
    description: Agent specialization modes (architect, coder, reviewer, etc.)
  - name: MCP
    description: MCP (Model Context Protocol) server management
  - name: Channels
    description: Real-time collaboration channels and threads
  - name: Benchmarks
    description: Benchmark suites, runs, and evaluation (dev-mode only)
  - name: Knowledge Bases
    description: Knowledge base management and indexing
  - name: Policies
    description: Policy profiles for agent tool-call permissions
  - name: Agents
    description: Agent task dispatch
  - name: Review
    description: Contract-first review and refactoring pipeline
  - name: Quarantine
    description: Held messages (inbound A2A prompts, handoffs) awaiting an admin's review
  - name: Webhooks
    description: Public webhook endpoints with their own authentication

paths:
  # -----------------------------------------------
  # Health (outside /api/v1, no auth required)
  # -----------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      description: |
        Returns service status and whether dev mode is active.
        This endpoint is outside the /api/v1 prefix and requires no authentication.
      operationId: healthLiveness
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  dev_mode:
                    type: boolean
                  dropped_logs:
                    type: integer
                    format: int64

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: |
        Checks all dependencies (PostgreSQL, NATS, LiteLLM) and returns
        503 if any are down. Used by container orchestrators for readiness probes.
      operationId: healthReadiness
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: All dependencies are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ready"
                  postgres:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [up, down]
                      latency:
                        type: string
                        example: "1.2ms"
                  nats:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [up, down]
                      latency:
                        type: string
                  litellm:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [up, down]
                      latency:
                        type: string
        "503":
          description: One or more dependencies are down
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "not_ready"

  # -----------------------------------------------
  # Auth
  # -----------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      description: |
        Validates credentials and returns a JWT access token.
        A refresh token is set as an httpOnly cookie on the /api/v1/auth path.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Uses the httpOnly refresh cookie to issue a new access token.
        No request body is needed -- the cookie is read automatically.
      operationId: refreshToken
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/setup-status:
    get:
      tags: [Auth]
      summary: Check if initial setup is complete
      description: |
        Returns whether the first admin user has been created.
        Public endpoint -- no authentication required.
      operationId: setupStatus
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_complete:
                    type: boolean

  /auth/setup:
    post:
      tags: [Auth]
      summary: Create the initial admin user
      description: |
        One-time setup endpoint that creates the first admin account.
        Requires the one-time setup token the Core logs once (SETUP TOKEN) and
        writes to auth.setup_token_file on a start without users (403 without
        or with a wrong token). Returns 409 if setup has already been completed.
      operationId: initialSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, setup_token]
              properties:
                setup_token:
                  type: string
                  description: One-time setup token (KI-119)
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                name:
                  type: string
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out the current user
      description: Clears the refresh cookie and invalidates the session.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/github:
    post:
      tags: [Auth]
      summary: Start the GitHub OAuth web flow
      description: |
        Stores a single-use state for the caller's tenant, sets an HttpOnly, SameSite=Lax state cookie
        (path `/api/v1/auth/github/callback`, 10 minutes) and returns GitHub's authorization URL for the UI to
        open. The redirect URI is the configured `github.callback_url`, never a request value. Answers 501
        until `github.client_id`, `github.client_secret` and `github.callback_url` are set.
      operationId: startGitHubOAuth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: GitHub authorization URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: The GitHub OAuth web flow is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/github/callback:
    get:
      tags: [Auth]
      summary: GitHub OAuth callback (redirect target of GitHub)
      description: |
        Public (GitHub's redirect carries no session). Checks the state cookie against the `state` query
        parameter, consumes the state once, exchanges the code, creates the VCS account in the tenant that
        started the flow and redirects (303) to the web UI: `/settings?github_oauth=connected`, or
        `/settings?github_oauth=failed&reason=<code>` with `reason` one of `denied`, `invalid_request`,
        `state_mismatch`, `invalid_state`, `exchange_failed`. Answers 501 while the flow is not configured.
      operationId: githubOAuthCallback
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Redirect to the settings page with the outcome
          headers:
            Location:
              schema:
                type: string
        "501":
          description: The GitHub OAuth web flow is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ws/ticket:
    post:
      tags: [Auth]
      summary: Issue a single-use WebSocket ticket
      description: |
        Issues a short-lived (30 s), single-use ticket bound to the caller's user and tenant.
        The client opens the WebSocket with `GET /ws?ticket=<ticket>` (root path, not under /api/v1);
        the connection receives only events of that tenant. The JWT is never sent in the WebSocket URL
        (`?token=` is rejected with 401). Users who must change their password get 403.
      operationId: issueWSTicket
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_in]
                properties:
                  ticket:
                    type: string
                    description: Opaque single-use ticket for `GET /ws?ticket=`
                  expires_in:
                    type: integer
                    description: Seconds until the ticket expires
                    example: 30
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: WebSocket tickets are not configured

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # -----------------------------------------------
  # Projects
  # -----------------------------------------------
  /projects:
    get:
      tags: [Projects]
      summary: List all projects
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      summary: Create a new project
      description: |
        Creates a project. Requires admin or editor role.
        Optionally pass local_path to auto-adopt a local workspace.
        Config keys the backend reads: policy_preset, execution_mode (only
        "mount"), test_command and lint_command (quality gate commands; 400
        unless they split like a shell command line and start with an
        executable on the worker's allowlist).
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get project by ID
      operationId: getProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update a project
      description: Updates project metadata. Requires admin or editor role. Config keys are merged (null deletes one); test_command and lint_command are validated as on create (400).
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                repo_url:
                  type: string
                config:
                  type: object
                  description: |
                    Merge patch for the project config: a key with a string value is set, a key
                    with null is deleted, keys not in the request are kept. Missing, null or empty
                    config leaves the stored config unchanged.
                  additionalProperties:
                    type: string
                    nullable: true
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Delete project (admin only)
      description: |
        With per-tenant tool users (`workspace.tool_acls: required`, production; KI-96) the project row is
        deleted together with a `workspace_deletions` record, and the worker removes the workspace afterwards
        as the tenant's tool UID (asynchronously, retried until done). The request is refused with 409 while
        the project has a run that has not ended, a conversation with an active turn, or a queued or running
        task. With `workspace.tool_acls: off` the Go Core removes the workspace itself.
      operationId: deleteProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "204":
          description: Project deleted (the workspace is removed by the worker when tool ACLs are required)
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The project has active work (runs, conversation turns or tasks); stop it first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The tenant has no tool UID yet and the tool UID range is exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -----------------------------------------------
  # Project files (workspace file API) and stack detection
  # -----------------------------------------------
  /projects/{id}/files:
    get:
      tags: [Projects]
      summary: List a workspace directory
      description: |
        Lists the entries of one directory of the project's workspace. Paths are workspace-relative (a leading `/` is
        ignored). Every path is resolved inside the workspace (KI-95): a relative symlink that stays inside is followed,
        any other symlink, `..` above the workspace and an absolute path are refused, and a special file (FIFO, socket,
        device) is never opened.
      operationId: listProjectFiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: path
          in: query
          description: Directory, relative to the workspace (default `.`)
          schema:
            type: string
            default: "."
      responses:
        "200":
          description: Directory entries (symlinks are listed, never followed into)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/WorkspacePathRefused"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Delete a workspace file or directory
      description: |
        Requires admin or editor role. Deletes the file or directory at `path` (a symlink is deleted itself, never its
        target). The workspace root cannot be deleted: `.` and any name that cleans to it, such as `x/..`, answer 400.
      operationId: deleteProjectFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: path
          in: query
          required: true
          description: File or directory, relative to the workspace
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/WorkspacePathRefused"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/files/tree:
    get:
      tags: [Projects]
      summary: List the whole workspace tree
      description: |
        Lists all files and directories of the workspace recursively, without `.git`. Symlinks are listed, never
        descended into. The walk is bounded.
      operationId: listProjectFileTree
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: max_entries
          in: query
          description: Maximum number of entries (default 10000, at most 50000)
          schema:
            type: integer
            default: 10000
            maximum: 50000
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/WorkspacePathRefused"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/files/content:
    get:
      tags: [Projects]
      summary: Read a workspace file
      description: |
        Reads a regular file of the workspace. A directory, FIFO, socket, device, a symlink that leaves the workspace
        and a file larger than 10 MiB answer 400.
      operationId: readProjectFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: path
          in: query
          required: true
          description: File, relative to the workspace
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "400":
          $ref: "#/components/responses/WorkspacePathRefused"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Write a workspace file
      description: |
        Requires admin or editor role. Creates or overwrites a regular file (parent directories are created). A path
        that leaves the workspace, or an existing special file, answers 400.
      operationId: writeProjectFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path:
                  type: string
                content:
                  type: string
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/WorkspacePathRefused"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/files/rename:
    patch:
      tags: [Projects]
      summary: Rename or move a workspace file or directory
      description: |
        Requires admin or editor role. A symlink is renamed itself, never its target. The workspace root can be neither
        the source nor the target: `.` and any name that cleans to it answer 400.
      operationId: renameProjectFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_path, new_path]
              properties:
                old_path:
                  type: string
                new_path:
                  type: string
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/WorkspacePathRefused"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /detect-stack:
    post:
      tags: [Projects]
      summary: Detect the language stack of a directory
      description: |
        Scans a directory for languages, frameworks and tool recommendations. The path must be absolute and lie strictly
        inside the caller's own tenant area of the workspace root (`<workspace.root>/<tenant_id>/...`, KI-106); it is
        resolved inside that area, so no symlink leads out of it. Platform admins may also name a directory strictly
        inside a `workspace.adopt_roots` directory outside the workspace root. Any other path answers 400: another
        tenant's directory, the tenant directory itself, the workspace root, or a symlink that leaves the area.
      operationId: detectStackByPath
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute directory path
      responses:
        "200":
          description: Detected stack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackDetectionResult"
        "400":
          description: Path missing, not absolute, or outside the caller's tenant area (outside the workspace root, outside the adopt roots or the caller is no platform admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -----------------------------------------------
  # Conversations
  # -----------------------------------------------
  /projects/{id}/conversations:
    get:
      tags: [Conversations]
      summary: List conversations for a project
      operationId: listConversations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      summary: Create a new conversation
      operationId: createConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                mode:
                  type: string
                  description: Mode ID (e.g., coder, reviewer, architect)
                model:
                  type: string
                  description: LLM model override (e.g., openai/gpt-4o)
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get a conversation by ID
      operationId: getConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Conversations]
      summary: Delete a conversation
      description: Requires admin or editor role.
      operationId: deleteConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "204":
          description: Conversation deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{id}/messages:
    get:
      tags: [Conversations]
      summary: List messages in a conversation
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      summary: Send a message to a conversation
      description: |
        Dispatches a user message. If the conversation is in agentic mode,
        this triggers an agent run via NATS and returns 202 immediately.
        Results stream to the frontend via WebSocket (AG-UI protocol).
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The user's message text
                agentic:
                  type: boolean
                  description: Override agentic mode (null uses project default)
                mode:
                  type: string
                  description: Mode override for this message
                model:
                  type: string
                  description: Model override for this message
                images:
                  type: array
                  description: Attached images for multimodal models
                  items:
                    type: object
                    properties:
                      data:
                        type: string
                        format: byte
                        description: Base64-encoded image data
                      media_type:
                        type: string
                        example: "image/png"
      responses:
        "202":
          description: Message dispatched (agentic mode)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "dispatched"
                  run_id:
                    type: string
                  message:
                    type: string
                    example: "Run dispatched. Results will stream via WebSocket."
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A run of this conversation is still in progress (one run per conversation); nothing is stored
        "500":
          $ref: "#/components/responses/InternalServerError"

  # -----------------------------------------------
  # Runs
  # -----------------------------------------------
  /runs:
    post:
      tags: [Runs]
      summary: Start a new agent run
      description: |
        Creates and starts a new run for a given task and agent.
        Requires admin or editor role. Rejected with 400 before anything is
        created when the project has no workspace, when `policy_profile` (or the
        project's profile) names an unknown profile, or when the task or the
        agent belongs to another project.
      operationId: startRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, agent_id, project_id]
              properties:
                task_id:
                  type: string
                agent_id:
                  type: string
                project_id:
                  type: string
                  format: uuid
                team_id:
                  type: string
                mode_id:
                  type: string
                policy_profile:
                  type: string
                  description: Policy preset name (e.g., trusted-mount-autonomous)
                exec_mode:
                  type: string
                  enum: [mount, sandbox, hybrid]
                  description: sandbox and hybrid are rejected with 400 until tools run inside the container
                deliver_mode:
                  type: string
                  enum: ["", patch, commit-local, branch, pr]
      responses:
        "201":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /runs/{id}:
    get:
      tags: [Runs]
      summary: Get run details
      operationId: getRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/cancel:
    post:
      tags: [Runs]
      summary: Cancel a running execution
      description: Requests cancellation of an active run. Requires admin or editor role.
      operationId: cancelRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "cancelled"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/approve/{callId}:
    post:
      tags: [Runs]
      summary: Approve or deny a pending tool call (HITL)
      description: |
        Resolves a Human-in-the-Loop approval request for a specific tool call.
        The agent pauses until this decision is received or the approval times out.
      operationId: approveToolCall
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: callId
          in: path
          required: true
          description: The tool call ID awaiting approval
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [allow, deny]
                  description: Whether to allow or deny the tool call
      responses:
        "200":
          description: Approval resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "resolved"
                  run_id:
                    type: string
                  call_id:
                    type: string
                  decision:
                    type: string
                    enum: [allow, deny]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No pending approval for this run/call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/approvals/{callId}:
    get:
      tags: [Runs]
      summary: Get a pending tool-call approval
      description: |
        The tool call of this run that awaits a decision, for the web approval page that approval emails link
        to (`<notification.web_ui_url>/approvals/<run>/<call>`). Requires admin or editor role; only a call
        pending in the caller's tenant is found.
      operationId: getPendingApproval
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: callId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApproval"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not pending (answered, timed out, the run ended) or of another tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /feedback/{run_id}/{call_id}:
    post:
      tags: [Runs]
      summary: Decide a pending tool call from the web approval page
      description: |
        Decides the tool call like `POST /runs/{id}/approve/{callId}`, with the decision as a query parameter
        (the web approval page that approval emails link to). Requires admin or editor role; only a call
        pending in the caller's tenant is decided. The feedback audit entry records the tool and the deciding user.
      operationId: decideFeedback
      security:
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: call_id
          in: path
          required: true
          schema:
            type: string
        - name: decision
          in: query
          required: true
          schema:
            type: string
            enum: [allow, deny]
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "resolved"
                  decision:
                    type: string
                    enum: [allow, deny]
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No pending approval for this run/call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/approve:
    post:
      tags: [Review]
      summary: Keep the refactoring of a review step
      description: |
        Keeps the refactoring of the review plan step whose refactorer run is `{id}` (a step that waits for
        approval is approved with it). Also possible after a failed or cancelled refactoring. Requires admin or
        editor role. Decisions are matched on the review record, so they survive run retention.
      operationId: approveReviewRefactoring
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The refactoring's measurement is still being recorded, try again in a moment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Review pipeline not configured

  /runs/{id}/reject:
    post:
      tags: [Review]
      summary: Undo the refactoring of a review step
      description: |
        Undoes the refactoring of the review plan step whose refactorer run is `{id}`: only the paths it changed
        are set back (three-way merge) and HEAD moves back only if it still points to the refactoring's commit
        (compare-and-swap). If the undo fails nothing is decided. Requires admin or editor role.
      operationId: rejectReviewRefactoring
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The refactoring's measurement is still being recorded, try again in a moment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Review pipeline not configured

  /runs/{id}/approve-partial:
    post:
      tags: [Review]
      summary: Approve part of a refactoring (not implemented)
      description: Requires admin or editor role. Approve or reject the refactoring as a whole.
      operationId: approveReviewRefactoringPartial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/trajectory:
    get:
      tags: [Runs]
      summary: Get the trajectory (step-by-step log) of a run
      description: Returns the full sequence of agent steps, tool calls, and results.
      operationId: getTrajectory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Trajectory data
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        step:
                          type: integer
                        type:
                          type: string
                        tool_name:
                          type: string
                        input:
                          type: string
                        output:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Settings
  # -----------------------------------------------
  /settings:
    get:
      tags: [Settings]
      summary: Get all application settings
      description: Returns settings as a key-value map.
      operationId: getSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                example:
                  theme: "dark"
                  language: "en"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Settings]
      summary: Update application settings (admin only)
      description: |
        Upserts one or more settings. The settings map must not be empty.
        Requires admin role.
      operationId: updateSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: true
                  description: Key-value pairs to upsert
                  example:
                    theme: "dark"
                    language: "en"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  # -----------------------------------------------
  # LLM
  # -----------------------------------------------
  /llm/models:
    get:
      tags: [LLM]
      summary: List active LLM models
      description: Returns all models currently configured in LiteLLM.
      operationId: listLLMModels
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    model_name:
                      type: string
                      example: "openai/gpt-4o"
                    litellm_params:
                      type: object
                      properties:
                        model:
                          type: string
                        api_base:
                          type: string
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [LLM]
      summary: Add an LLM model to LiteLLM
      description: Platform admin only (an admin of the default tenant; models are shared by all tenants), audited. Others get 403.
      operationId: addLLMModel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_name, litellm_params]
              properties:
                model_name:
                  type: string
                  example: "openai/gpt-4o"
                litellm_params:
                  type: object
                  properties:
                    model:
                      type: string
                    api_key:
                      type: string
                    api_base:
                      type: string
      responses:
        "201":
          description: Model added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /llm/models/{id}:
    delete:
      tags: [LLM]
      summary: Delete an LLM model deployment from LiteLLM
      description: |
        Platform admin only (an admin of the default tenant), audited. `id` is the LiteLLM
        deployment ID (`model_id` in the model list, taken from LiteLLM's `model_info.id`).
        Models are shared by all tenants.
        Replaces `POST /llm/models/delete` (405 since 2026-09-30).
      operationId: deleteLLMModel
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Model deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: LiteLLM rejected the deletion

  /llm/health:
    get:
      tags: [LLM]
      summary: Check LiteLLM proxy health
      description: Returns the health status of the LiteLLM sidecar.
      operationId: llmHealth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: LiteLLM is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
        "503":
          description: LiteLLM is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -----------------------------------------------
  # Dashboard
  # -----------------------------------------------
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard summary statistics
      description: |
        Returns aggregated metrics for the dashboard: costs, active runs,
        success rates, token usage, and error rates with delta percentages.
      operationId: getDashboardStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # -----------------------------------------------
  # Costs
  # -----------------------------------------------
  /costs:
    get:
      tags: [Costs]
      summary: Global cost summary across all projects
      description: Returns cost aggregations per project.
      operationId: globalCostSummary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cost summary list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    project_id:
                      type: string
                      format: uuid
                    project_name:
                      type: string
                    total_cost_usd:
                      type: number
                      format: double
                    total_runs:
                      type: integer
                    total_tokens_in:
                      type: integer
                      format: int64
                    total_tokens_out:
                      type: integer
                      format: int64
        "500":
          $ref: "#/components/responses/InternalServerError"

  /projects/{id}/costs:
    get:
      tags: [Costs]
      summary: Cost summary for a specific project
      operationId: projectCostSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Project cost summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  total_cost_usd:
                    type: number
                    format: double
                  total_runs:
                    type: integer
                  total_tokens_in:
                    type: integer
                    format: int64
                  total_tokens_out:
                    type: integer
                    format: int64
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # GDPR
  # -----------------------------------------------
  /me/export:
    get:
      tags: [GDPR]
      summary: Export own data (GDPR Article 20)
      description: |
        Self-service endpoint. Returns all personal data for the authenticated user
        in a portable JSON format. No admin role required.
      operationId: exportMyData
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /me/data:
    delete:
      tags: [GDPR]
      summary: Delete own data (GDPR Article 17)
      description: |
        Self-service endpoint. Deletes all personal data for the authenticated user.
        This action is irreversible.
      operationId: deleteMyData
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User data deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{id}/export:
    post:
      tags: [GDPR]
      summary: Export all user data (admin only, GDPR Article 20)
      operationId: exportUserData
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExport"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/data:
    delete:
      tags: [GDPR]
      summary: Delete all user data (admin only, GDPR Article 17)
      operationId: deleteUserData
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User data deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Conversations (additional)
  # -----------------------------------------------
  /conversations/{id}/stop:
    post:
      tags: [Conversations]
      summary: Stop an active conversation run
      description: Cancels the currently running agent loop for this conversation.
      operationId: stopConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: Conversation stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "stopped"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{id}/fork:
    post:
      tags: [Conversations]
      summary: Fork a conversation at a specific point
      description: Creates a copy of the conversation for branching exploration.
      operationId: forkConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "201":
          description: Forked conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{id}/compact:
    post:
      tags: [Conversations]
      summary: Compact conversation history
      description: |
        Triggers context compaction to reduce token usage while preserving
        essential information. Useful when approaching context window limits.
      operationId: compactConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: Conversation compacted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "compacted"
                  messages_before:
                    type: integer
                  messages_after:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Modes
  # -----------------------------------------------
  /modes:
    get:
      tags: [Modes]
      summary: List all available agent modes
      description: |
        Returns built-in and custom modes. Each mode defines tools, LLM,
        autonomy level, and prompt for a specific agent role.
      operationId: listModes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mode list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mode"
    post:
      tags: [Modes]
      summary: Create a custom agent mode
      description: Requires admin or editor role.
      operationId: createMode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModeRequest"
      responses:
        "201":
          description: Mode created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /modes/{id}:
    get:
      tags: [Modes]
      summary: Get a mode by ID
      operationId: getMode
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
