  # -----------------------------------------------
  # MCP Servers
  # -----------------------------------------------
  /mcp/servers:
    get:
      tags: [MCP]
      summary: List registered MCP servers
      description: |
        Returns the MCP servers of the caller's tenant. Env and header values are never returned: every
        value that is set is shown as `***` (an empty value stays empty), for every role.
      operationId: listMCPServers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: MCP server list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPServer"
    post:
      tags: [MCP]
      summary: Register a new MCP server
      description: |
        Adds an MCP server to the tenant's registry. Requires the admin role of the tenant (not only a platform
        admin; editors and viewers get 403). Audited. Stdio servers run in the worker as the tool user, never in
        the Go Core. The response redacts env and header values to `***`.
      operationId: createMCPServer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMCPServerRequest"
      responses:
        "201":
          description: MCP server registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          description: |
            Invalid definition (name, transport, `command` for stdio or `url` for sse and streamable_http missing),
            or an env or header value is `***`: a new server has no stored value that could stand for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"

  /mcp/servers/test:
    post:
      tags: [MCP]
      summary: Test an MCP server definition before saving it
      description: |
        Performs a real MCP handshake (initialize and tools/list) from the Go Core against an `sse` or
        `streamable_http` definition. Requires the admin role of the tenant. The body may carry the `id` of a
        saved server of the tenant: env and header values sent as `***` then connect with the stored values, but
        only while transport, url, command and args equal the stored ones (otherwise 400, so a stored secret is
        never sent to another destination). Stdio definitions are refused with 400: the Go Core never starts a
        stdio server, they run in the worker.
      operationId: testMCPServerDefinition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMCPServerRequest"
      responses:
        "200":
          description: Test outcome (`success` is false when the connection failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTestResult"
        "400":
          description: |
            Invalid definition, a stdio transport ("stdio servers cannot be tested from the core; they run in the
            worker"), or `***` values that cannot be resolved (no `id`, nothing stored for the key, or a changed
            transport, url, command or args).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/servers/{id}:
    get:
      tags: [MCP]
      summary: Get an MCP server by ID
      description: Env and header values are returned as `***` (see the list endpoint).
      operationId: getMCPServer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: MCP server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [MCP]
      summary: Update an MCP server
      description: |
        Requires the admin role of the tenant. Audited. An env or header value sent as `***` (what reads return)
        keeps the stored value, only while transport, url, command and args are unchanged. 400 when `***` is sent
        for a key with nothing stored, or when the transport, url, command or args changed while a value is
        `***` (enter the values again). The response redacts values to `***`.
      operationId: updateMCPServer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMCPServerRequest"
      responses:
        "200":
          description: MCP server updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [MCP]
      summary: Delete an MCP server
      description: Requires the admin role of the tenant. Audited.
      operationId: deleteMCPServer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: MCP server deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/servers/{id}/test:
    post:
      tags: [MCP]
      summary: Test a saved MCP server
      description: |
        Re-reads the saved definition (with its stored env and header values), performs a real MCP handshake from
        the Go Core and updates the server's status (`connected` or `error`). Requires the admin role of the
        tenant. A stdio server answers 400 and its status is left unchanged: stdio servers run in the worker.
      operationId: testMCPServer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Test outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPTestResult"
        "400":
          description: The server uses the stdio transport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp/servers/{id}/tools:
    get:
      tags: [MCP]
      summary: List tools exposed by an MCP server
      operationId: listMCPServerTools
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tool list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    input_schema:
                      type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/mcp-servers:
    get:
      tags: [MCP]
      summary: List the MCP servers assigned to a project
      description: Env and header values are returned as `***`.
      operationId: listProjectMCPServers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Assigned MCP servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPServer"
    post:
      tags: [MCP]
      summary: Assign an MCP server to a project
      description: |
        Requires the admin role of the tenant. The project and the server must belong to the caller's tenant;
        assigning across tenants answers 404. Assigning an assigned server again changes nothing.
        The assignment is audited as action `assign` on resource `mcp_server` (resource ID: the `server_id`,
        details: `project_id`) and the entry is written before the change: when it cannot be written the
        request is refused with 503 and nothing changes. A request refused earlier (invalid body) is audited
        afterwards with an empty resource ID and its HTTP status.
      operationId: assignMCPServerToProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_id]
              properties:
                server_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Server assigned
        "400":
          description: Invalid body or `server_id` missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The project or the server does not exist in the caller's tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The audit log is unavailable; nothing was changed

  /projects/{id}/mcp-servers/{serverId}:
    delete:
      tags: [MCP]
      summary: Unassign an MCP server from a project
      description: |
        Requires the admin role of the tenant. Audited like the assignment (action `unassign`, written before
        the change, 503 when it cannot be written). A link that does not exist in the caller's tenant, including
        one of another tenant, answers 404.
      operationId: unassignMCPServerFromProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: serverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Server unassigned
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The audit log is unavailable; nothing was changed

  # -----------------------------------------------
  # Channels
  # -----------------------------------------------
  /channels:
    get:
      tags: [Channels]
      summary: List real-time channels
      description: |
        Each channel carries `has_webhook_key` and the caller's `unread_count` (top-level messages of others
        after the caller's read position; 0 for callers without a users row, such as auth disabled or the
        internal service key).
      operationId: listChannels
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Channel list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      tags: [Channels]
      summary: Create a new channel
      description: Requires admin or editor role.
      operationId: createChannel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                project_id:
                  type: string
                  format: uuid
                  description: Optional project to associate the channel with
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /channels/{id}:
    get:
      tags: [Channels]
      summary: Get a channel by ID
      operationId: getChannel
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Channel details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Channels]
      summary: Delete a channel
      operationId: deleteChannel
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Channel deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /channels/{id}/messages:
    get:
      tags: [Channels]
      summary: List messages in a channel
      operationId: listChannelMessages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Channel message list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    channel_id:
                      type: string
                      format: uuid
                    user_id:
                      type: string
                      format: uuid
                    content:
                      type: string
                    created_at:
                      type: string
                      format: date-time
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Channels]
      summary: Send a message to a channel
      operationId: sendChannelMessage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  content:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /channels/{id}/webhook-key:
    post:
      tags: [Channels]
      summary: Generate the channel's webhook key
      description: |
        Admin only. Makes a new key and returns it once (only its SHA-256 is stored); a previous key stops
        working. External systems post with it to `POST /webhooks/channels/{id}`.
      operationId: regenerateChannelWebhookKey
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The new key (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [webhook_key]
                properties:
                  webhook_key:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /channels/{id}/read:
    post:
      tags: [Channels]
      summary: Move the caller's read position in a channel
      description: |
        Moves the caller's read position to a message and broadcasts `channel.read`. Answers 204 without storing
        anything for callers without a users row (auth disabled, internal service key).
      operationId: markChannelRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The new read position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelReadState"
        "204":
          description: Read positions are not tracked for this caller
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Channels]
      summary: List the members' read positions in a channel
      operationId: listChannelReadStates
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Read positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelReadState"
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Webhooks (public, outside the JWT middleware)
  # -----------------------------------------------
  /webhooks/channels/{id}:
    post:
      tags: [Webhooks]
      summary: Post a message to a channel from an external system
      description: |
        Authenticated by the channel's webhook key in `X-Webhook-Key` (constant-time comparison). Answers 401
        without the header and one uniform 403 for a wrong key, an unknown channel and a channel ID that is not a
        UUID. The message is posted as a webhook sender in the channel's tenant.
      operationId: postChannelWebhookMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Webhook-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                sender_name:
                  type: string
                  description: Display label of the sender
      responses:
        "201":
          description: Message posted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /webhooks/pm/github:
    post:
      tags: [Webhooks]
      summary: GitHub issue webhook (roadmap sync)
      description: |
        Verified with the HMAC header `X-Hub-Signature-256` (`webhook.github_secret`). The project is found by an
        exact match of repository host and full path, case-insensitive, in the webhook's tenant. Answers 202 when
        the pull sync started (its outcome is announced as a `pm.sync` WebSocket event with `status` `completed`
        or `failed` and an `error`), 404 when no project matches, 400 when the provider cannot sync (not
        registered or configured, project on another host), 200 `{status: ignored}` for other event types.
        The body of a 202 is the parsed event.
      operationId: githubPMWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PMWebhookEvent"
        "200":
          description: Event type ignored
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/pm/gitlab:
    post:
      tags: [Webhooks]
      summary: GitLab issue webhook (roadmap sync)
      description: |
        Verified with the token header `X-Gitlab-Token` (`webhook.gitlab_token`). Same answers as
        `POST /webhooks/pm/github`; the sync is anonymous (no GitLab API token is configurable) and uses the
        project's repository host.
      operationId: gitlabPMWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PMWebhookEvent"
        "200":
          description: Event type ignored
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/pm/plane:
    post:
      tags: [Webhooks]
      summary: Plane webhook (roadmap sync)
      description: |
        Verified with the HMAC header `X-Plane-Signature` (`webhook.plane_secret`). The project is the one whose
        config has the webhook's `plane_project_id` and a `plane_workspace`. The operator's Plane token
        (`plane.api_token`) is sent only to `plane.base_url`: a project whose `plane_base_url` names another host
        gets 400 and a `pm.sync` event with `status` `failed`. Other answers as for `POST /webhooks/pm/github`.
      operationId: planePMWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PMWebhookEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Policies
  # -----------------------------------------------
  /policies:
    get:
      tags: [Policies]
      summary: List policy profiles
      description: Returns all policy profiles (built-in presets and custom).
      operationId: listPolicyProfiles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Policy profile list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyProfile"
    post:
      tags: [Policies]
      summary: Create a custom policy profile
      description: Requires admin or editor role.
      operationId: createPolicyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, rules]
              properties:
                name:
                  type: string
                description:
                  type: string
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      pattern:
                        type: string
                        description: Glob pattern matching tool calls
                      effect:
                        type: string
                        enum: [allow, deny, ask]
      responses:
        "201":
          description: Policy profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The name is a built-in preset or a policy file for it already exists

  /policies/allow-always:
    post:
      tags: [Policies]
      summary: Persist an "Allow Always" rule for a project
      description: |
        Admin only. Adds an allow rule for the tool (Bash: `command_allow` with every executable of the
        approved command) to the per-project clone `{profile}-custom-{project_id}` of the profile that
        decided the call. The clone replaces that profile only for this project; the project's profile
        selection is not changed. The rule never overrides a deny list. Persisted to `policy.custom_dir`.
      operationId: allowAlwaysPolicy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, tool]
              properties:
                project_id:
                  type: string
                profile:
                  type: string
                  description: Profile named by the agui.permission_request event (optional; default is the project's effective profile)
                tool:
                  type: string
                  description: Tool name as sent by the worker (canonicalized server-side)
                command:
                  type: string
                  description: The approved bash command (Bash only)
      responses:
        "200":
          description: The updated profile clone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown project or profile
        "409":
          description: No policy directory configured (policy.custom_dir is empty)

  /policies/{name}/evaluate:
    post:
      tags: [Policies]
      summary: Evaluate a tool call against a policy profile (policy tester)
      description: |
        Evaluates the call like a run would, in a synthetic workspace `/workspace` (the tester has no
        project): relative paths and Bash redirection targets are placed under it, an absolute path only when
        it is under `/workspace`.
      operationId: evaluatePolicy
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool:
                  type: string
                command:
                  type: string
                path:
                  type: string
      responses:
        "200":
          description: The decision and its reason
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Benchmarks (dev-mode only)
  # -----------------------------------------------
  /benchmarks/suites:
    get:
      tags: [Benchmarks]
      summary: List benchmark suites
      description: Returns all benchmark suites. Requires APP_ENV=development.
      operationId: listBenchmarkSuites
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Benchmark suite list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkSuite"
        "403":
          description: Not in development mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Benchmarks]
      summary: Create a benchmark suite
      description: Requires APP_ENV=development.
      operationId: createBenchmarkSuite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                  description: Suite type (e.g., deepeval, functional_test, sparc)
                provider_name:
                  type: string
                config:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Suite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkSuite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Not in development mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /benchmarks/runs:
    post:
      tags: [Benchmarks]
      summary: Start a benchmark run
      description: Creates and starts a benchmark run for the given suite. Requires APP_ENV=development.
      operationId: createBenchmarkRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suite_id]
              properties:
                suite_id:
                  type: string
                  format: uuid
                model:
                  type: string
                  description: LLM model to evaluate
                config:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Not in development mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /benchmarks/runs/{id}:
    get:
      tags: [Benchmarks]
      summary: Get benchmark run details
      operationId: getBenchmarkRun
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Benchmark run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"
        "404":
          $ref: "#/components/responses/NotFound"

  /benchmarks/runs/{id}/results:
    get:
      tags: [Benchmarks]
      summary: List the results of a benchmark run
      description: |
        Requires APP_ENV=development. A dimension an evaluator could not score is never a 0.0 score: it is
        missing from `scores` and named in `evaluation_errors` (dimension -> error).
      operationId: listBenchmarkResults
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /benchmarks/runs/{id}/export/rlvr:
    get:
      tags: [Benchmarks]
      summary: Export RLVR rewards of a benchmark run
      description: |
        Requires APP_ENV=development. JSONL by default, a JSON array with `format=json`. Results with
        evaluation errors and no valid score are left out; a partial result uses its valid dimensions. The
        training-pair export (`/export/training`) follows the same rule.
      operationId: exportBenchmarkRLVR
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum: [json]
      responses:
        "200":
          description: RLVR entries
          content:
            application/x-ndjson:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Agents
  # -----------------------------------------------
  /agents/{id}/dispatch:
    post:
      tags: [Agents]
      summary: Dispatch a task to an agent's backend
      description: Requires admin or editor role. A task that is already queued or running is not dispatched again.
      operationId: dispatchAgentTask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id:
                  type: string
      responses:
        "200":
          description: Dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "dispatched"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The task is queued or running (dispatching it again would start a second run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -----------------------------------------------
  # Review (contract-first review and refactoring)
  # -----------------------------------------------
  /projects/{id}/review-refactor:
    post:
      tags: [Review]
      summary: Start the review-refactor pipeline
      description: |
        Requires admin or editor role. Starts a review plan (boundary analysis, contract review, review,
        refactoring) and answers 202 with its plan ID. 400 for a workspace that is not a git repository, a
        project without agents or a workspace; 409 when the project already has an active review pipeline or the
        agent belongs to another plan; 503 when the review pipeline is not configured.
      operationId: triggerReviewRefactor
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                commit_sha:
                  type: string
      responses:
        "202":
          description: Plan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTriggerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another review pipeline or plan holds the project or the agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Review pipeline not configured

  /projects/{id}/boundaries/analyze:
    post:
      tags: [Review]
      summary: Start a boundary analysis
      description: Requires admin or editor role. Same answers as `POST /projects/{id}/review-refactor`.
      operationId: triggerBoundaryAnalysis
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Plan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTriggerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another review pipeline or plan holds the project or the agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Review pipeline not configured

  /projects/{id}/review/pending:
    get:
      tags: [Review]
      summary: List the refactorings that wait for a keep or undo decision
      description: Oldest first. They wait until decided; there is no timeout.
      operationId: listPendingReviewDecisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Pending decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingReviewDecision"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Review pipeline not configured

  # -----------------------------------------------
  # Quarantine (admin only)
  # -----------------------------------------------
  /quarantine:
    get:
      tags: [Quarantine]
      summary: List quarantined messages
      description: |
        Admin only. Without `project_id` it lists the messages without a project (inbound A2A prompts).
        Messages are only held while `quarantine.enabled` is true.
      operationId: listQuarantinedMessages
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, expired]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuarantineMessage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Quarantine service not configured

  /quarantine/stats:
    get:
      tags: [Quarantine]
      summary: Count quarantined messages by status
      description: Admin only. Without `project_id` it counts the messages without a project (inbound A2A prompts).
      operationId: quarantineStats
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
                  approved:
                    type: integer
                  rejected:
                    type: integer
                  expired:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Quarantine service not configured

  /quarantine/{id}/approve:
    post:
      tags: [Quarantine]
      summary: Approve a quarantined message
      description: |
        Admin only. Replays the held message to its subject. The reviewer is the logged-in user (`reviewed_by_id`
        is recorded when the user has an account row; a name in the body is ignored). The held prompt of an
        inbound A2A task is replayed only while its task still waits for it (state `submitted`): otherwise the
        message is rejected instead and the call answers 409.
      operationId: approveQuarantinedMessage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        "200":
          description: Approved and replayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "approved"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The held A2A task no longer waits for the message (the message is rejected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /quarantine/{id}/reject:
    post:
      tags: [Quarantine]
      summary: Reject a quarantined message
      description: |
        Admin only. Blocks the message for good; the inbound A2A task whose prompt it held is rejected with it.
        The reviewer is the logged-in user.
      operationId: rejectQuarantinedMessage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "rejected"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Knowledge Bases
  # -----------------------------------------------
  /knowledge-bases:
    get:
      tags: [Knowledge Bases]
      summary: List all knowledge bases
      operationId: listKnowledgeBases
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Knowledge base list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      tags: [Knowledge Bases]
      summary: Create a knowledge base
      operationId: createKnowledgeBase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                source_type:
                  type: string
                  description: Source type (url, directory, document)
                source_uri:
                  type: string
      responses:
        "201":
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"

  /knowledge-bases/{id}:
    get:
      tags: [Knowledge Bases]
      summary: Get a knowledge base by ID
      operationId: getKnowledgeBase
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Knowledge base details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Knowledge Bases]
      summary: Delete a knowledge base
      operationId: deleteKnowledgeBase
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Knowledge base deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /knowledge-bases/{id}/index:
    post:
      tags: [Knowledge Bases]
      summary: Trigger indexing of a knowledge base
      description: Starts or refreshes the retrieval index for this knowledge base.
      operationId: indexKnowledgeBase
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Indexing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "indexing"
        "404":
          $ref: "#/components/responses/NotFound"

  # -----------------------------------------------
  # Search
  # -----------------------------------------------
  /search/conversations:
    post:
      tags: [Conversations]
      summary: Full-text search across conversations
      description: |
        Searches conversation messages using PostgreSQL FTS with GIN index
        and ts_rank scoring.
      operationId: searchConversations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Search query string
                project_id:
                  type: string
                  format: uuid
                  description: Optional project filter
                limit:
                  type: integer
                  default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        conversation_id:
                          type: string
                          format: uuid
                        message_id:
                          type: string
                          format: uuid
                        content:
                          type: string
                        rank:
                          type: number
                          format: double
        "400":
          $ref: "#/components/responses/BadRequest"

  # -----------------------------------------------
  # Conversations: bypass-approvals
  # -----------------------------------------------
  /conversations/{id}/bypass-approvals:
    post:
      tags: [Conversations]
      summary: Bypass all pending HITL approvals for a conversation
      description: |
        Auto-approves all pending and future tool call requests for this
        conversation. Admin only. Useful for headless/CI mode.
      operationId: bypassConversationApprovals
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: Approvals bypassed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "bypassed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from POST /auth/login.
        Pass as: Authorization: Bearer <token>

  parameters:
    ProjectID:
      name: id
      in: path
      required: true
      description: Project UUID
      schema:
        type: string
        format: uuid

    ConversationID:
      name: id
      in: path
      required: true
      description: Conversation UUID
      schema:
        type: string
        format: uuid

    RunID:
      name: id
      in: path
      required: true
      description: Run ID
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Insufficient permissions (role check failed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        tenant_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        expires_in:
          type: integer
          description: Token lifetime in seconds
        user:
          $ref: "#/components/schemas/User"

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        repo_url:
          type: string
        status:
          type: string
          enum: [created, cloning, ready, error]
        config:
          type: object
          additionalProperties:
            type: string
          description: Project-level configuration (policy_preset, execution_mode, detected_languages, expansion_prompt, ...)
        workspace_path:
          type: string
          description: Absolute path to the local workspace (if adopted/cloned)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        repo_url:
          type: string
          description: Git clone URL (optional for local-only projects)
        local_path:
          type: string
          description: Local filesystem path to auto-adopt as workspace
        config:
          type: object
          additionalProperties:
            type: string
          description: |
            Project config map. Keys the backend reads: policy_preset, execution_mode (default exec
            mode for runs and agentic conversations; only mount is accepted until sandbox isolation
            exists), expansion_prompt. Autonomy comes from the selected mode.

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        mode:
          type: string
          description: Active mode (coder, reviewer, architect, etc.)
        model:
          type: string
          description: LLM model in use
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        tool_calls:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              arguments:
                type: string
        cost_usd:
          type: number
          format: double
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    Run:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        agent_id:
          type: string
        project_id:
          type: string
          format: uuid
        mode_id:
          type: string
        policy_profile:
          type: string
        exec_mode:
          type: string
          enum: [mount, sandbox, hybrid]
        deliver_mode:
          type: string
          enum: ["", patch, commit-local, branch, pr]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, timeout, quality_gate]
        step_count:
          type: integer
        cost_usd:
          type: number
          format: double
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        model:
          type: string
        output:
          type: string
        error:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DashboardStats:
      type: object
      properties:
        cost_today_usd:
          type: number
          format: double
        cost_today_delta_pct:
          type: number
          format: double
          description: Percentage change vs yesterday
        active_runs:
          type: integer
        success_rate_7d_pct:
          type: number
          format: double
        success_rate_delta_pct:
          type: number
          format: double
        active_agents:
          type: integer
        avg_cost_per_run_usd:
          type: number
          format: double
        avg_cost_delta_pct:
          type: number
          format: double
        token_usage_today:
          type: integer
          format: int64
        token_usage_delta_pct:
          type: number
          format: double
        error_rate_24h_pct:
          type: number
          format: double
        error_rate_delta_pct:
          type: number
          format: double

    UserDataExport:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        api_keys:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              prefix:
                type: string
              created_at:
                type: string
                format: date-time
        llm_keys:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              provider:
                type: string
              label:
                type: string
              key_prefix:
                type: string
              created_at:
                type: string
                format: date-time

    Mode:
      type: object
      properties:
        id:
          type: string
          description: Mode slug (e.g., coder, reviewer, architect)
        name:
          type: string
        description:
          type: string
        tools:
          type: array
          items:
            type: string
          description: Allowed tool names for this mode
        denied_tools:
          type: array
          items:
            type: string
          description: Explicitly denied tool names
        llm_model:
          type: string
          description: Preferred LLM model for this mode
        autonomy_level:
          type: integer
          minimum: 1
          maximum: 5
        system_prompt:
          type: string
        built_in:
          type: boolean
          description: Whether this is a built-in mode (cannot be deleted)

    CreateModeRequest:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Mode slug (unique identifier)
        name:
          type: string
        description:
          type: string
        tools:
          type: array
          items:
            type: string
        denied_tools:
          type: array
          items:
            type: string
        llm_model:
          type: string
        autonomy_level:
          type: integer
          minimum: 1
          maximum: 5
        system_prompt:
          type: string

    MCPServer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        transport:
          type: string
          enum: [stdio, sse, streamable_http]
        command:
          type: string
          description: Command the worker starts as the tool user (stdio transport)
        args:
          type: array
          items:
            type: string
          description: Command arguments; not redacted, keep secrets in env or headers
        url:
          type: string
          description: Endpoint of an sse or streamable_http server; credentials in the URL are not redacted
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables of a stdio server. Every set value is returned as `***`.
        headers:
          type: object
          additionalProperties:
            type: string
          description: HTTP headers of an sse or streamable_http server. Every set value is returned as `***`.
        enabled:
          type: boolean
        status:
          type: string
          enum: [registered, connected, disconnected, error]

    CreateMCPServerRequest:
      type: object
      required: [name, transport]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Only for `POST /mcp/servers/test`: the saved server whose stored env and header values stand for
            values sent as `***`.
        name:
          type: string
        description:
          type: string
        transport:
          type: string
          enum: [stdio, sse, streamable_http]
        command:
          type: string
          description: Required for stdio
        args:
          type: array
          items:
            type: string
        url:
          type: string
          description: Required for sse and streamable_http
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Values are stored and never returned. `***` keeps the stored value of an update (400 on create or
            for a key with nothing stored). Names that make the loader or an interpreter load code (`LD_*`,
            `PYTHON*`, `NODE_OPTIONS`, ...) and the worker's own credentials are dropped by the worker.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Like env.
        enabled:
          type: boolean
          default: true

    MCPTestResult:
      type: object
      properties:
        success:
          type: boolean
        server_name:
          type: string
        server_version:
          type: string
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
        error:
          type: string

    Channel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        member_count:
          type: integer
        has_webhook_key:
          type: boolean
          description: A webhook key was generated (the key itself is never returned again)
        unread_count:
          type: integer
          description: Top-level messages of others after the caller's read position
        created_at:
          type: string
          format: date-time

    ChannelReadState:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        last_read_message_id:
          type: string
          format: uuid
        last_read_at:
          type: string
          format: date-time

    PendingApproval:
      type: object
      description: A tool call awaiting a human decision (the agui.permission_request payload)
      properties:
        run_id:
          type: string
        call_id:
          type: string
        tool:
          type: string
        command:
          type: string
        path:
          type: string
        profile:
          type: string
          description: The policy profile that asked
        arguments_preview:
          type: string
          description: Display-only preview of the call's arguments

    PMWebhookEvent:
      type: object
      properties:
        provider:
          type: string
          enum: [github, gitlab, plane]
        action:
          type: string
        item_id:
          type: string
        project_ref:
          type: string

    ReviewTriggerResponse:
      type: object
      properties:
        triggered:
          type: boolean
          example: true
        plan_id:
          type: string

    ReviewDecisionRequest:
      type: object
      required: [plan_id, step_id]
      properties:
        plan_id:
          type: string
        step_id:
          type: string

    ReviewDecision:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
          description: approved = refactoring kept, rejected = undone
        head_restored:
          type: boolean
          description: The refactoring had moved HEAD and HEAD was moved back
        message:
          type: string
          description: What the undo could not do, for example why HEAD was left
        restored_paths:
          type: array
          items:
            type: string

    PendingReviewDecision:
      type: object
      properties:
        run_id:
          type: string
        plan_id:
          type: string
        step_id:
          type: string
        project_id:
          type: string
        impact_level:
          type: string
        files_changed:
          type: integer
        lines_added:
          type: integer
        lines_removed:
          type: integer
        cross_layer:
          type: boolean
        structural:
          type: boolean
        reason:
          type: string
          description: Why approval is needed when the change could not be measured
        step_status:
