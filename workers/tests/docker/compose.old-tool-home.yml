# The worker service of the KI-71 compose file: no tool_homes volume, the
# shared tool user's tmpfs HOME. The new image's HOME base is then a
# directory of the read-only root: the worker is not ready (KI-96 D7).
services:
  worker:
    volumes: !override
      - workspaces:/data/workspaces
      - knowledge:/data/knowledge:ro
      - ./workers/tests:/app/workers/tests:ro
    tmpfs: !override
      - /tmp
      - /run/secrets:uid=10001,gid=10001,mode=0700
      - /home/codeforge-tool:uid=10002,gid=10002,mode=0700
