# Blue-green deployment overlay for CodeForge
#
# Usage (ACME_EMAIL and CODEFORGE_DOMAIN from the environment or .env):
#   docker compose -f docker-compose.prod.yml -f docker-compose.blue-green.yml up -d
#     starts the infrastructure, the worker and Traefik (no color yet)
#   ./scripts/deploy-blue-green.sh [blue|green]
#     starts the inactive (or given) color, waits until it is healthy and
#     stops the active one; DRY_RUN=1 only prints what it would do
#
# Traefik is the only service that publishes ports (80, 443). It terminates
# TLS for CODEFORGE_DOMAIN with a Let's Encrypt certificate (HTTP challenge)
# and routes /api, /health, /ws, /.well-known and /a2a to core-<color> and
# everything else to frontend-<color>. The routes come from its file
# provider: deploy-blue-green.sh writes traefik/dynamic/active-color.yaml
# when it switches colors. No service of this overlay reaches the Docker API:
# even read access serves every container's files and /run/secrets
# (/containers/{id}/archive), which an internet-facing proxy must not hold
# (KI-214).
#
# The colored services (profiles "blue" and "green", so a plain `up -d`
# starts neither) extend the prod services from their file and drop their
# published ports (`ports: !reset []` on each service; the Compose tags
# !reset and !override make check-yaml parse this file with --unsafe). Each
# frontend proxies to the core of its own color (CORE_UPSTREAM). Both cores
# carry the network alias "core", which the worker (CODEFORGE_CORE_URL)
# uses; during a switch it resolves to both. The prod "core" and "frontend"
# services are not started (profile "donotstart").

x-core-color: &core-color
  extends:
    file: docker-compose.prod.yml
    service: core
  networks:
    public:
      aliases:
        - core
    internal:
      aliases:
        - core

x-frontend-color: &frontend-color
  extends:
    file: docker-compose.prod.yml
    service: frontend

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    # Static configuration as flags: Traefik reads a static configuration file
    # verbatim (no environment expansion), Compose expands these.
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL to the Let's Encrypt account email}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --api.dashboard=false
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Authorization=redact
      - --log.level=INFO
      - --log.format=json
    # The routes' Host rule reads it ({{ env "CODEFORGE_DOMAIN" }}).
    environment:
      CODEFORGE_DOMAIN: ${CODEFORGE_DOMAIN:?set CODEFORGE_DOMAIN to the public host name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A directory, not single files: the deployment replaces
      # active-color.yaml by a rename, which Traefik sees only this way.
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - acme_data:/acme
    # Writes only the ACME volume; binds 80 and 443 without root's other rights.
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - public

  core-blue:
    <<: *core-color
    # Only Traefik publishes ports. !reset works on the service itself only,
    # not through the merge key above.
    ports: !reset []
    profiles:
      - blue

  core-green:
    <<: *core-color
    ports: !reset []
    profiles:
      - green

  frontend-blue:
    <<: *frontend-color
    ports: !reset []
    profiles:
      - blue
    environment:
      CORE_UPSTREAM: core-blue:8080
    depends_on: !override
      core-blue:
        condition: service_healthy

  frontend-green:
    <<: *frontend-color
    ports: !reset []
    profiles:
      - green
    environment:
      CORE_UPSTREAM: core-green:8080
    depends_on: !override
      core-green:
        condition: service_healthy

  # The single-color services of the prod file are replaced by the colors.
  core:
    profiles:
      - donotstart

  frontend:
    profiles:
      - donotstart

networks:
  # Traefik reaches the colors on it by their service names.
  public:
    name: codeforge-public

volumes:
  acme_data:
