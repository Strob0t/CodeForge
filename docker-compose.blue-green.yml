# Blue-green deployment overlay for CodeForge
#
# Usage (ACME_EMAIL and CODEFORGE_DOMAIN from the environment or .env):
#   docker compose -f docker-compose.prod.yml -f docker-compose.blue-green.yml up -d
#     starts the infrastructure, the worker and Traefik (no color yet)
#   ./scripts/deploy-blue-green.sh [blue|green]
#     starts the inactive (or given) color, waits until it is healthy and
#     stops the active one; DRY_RUN=1 only prints what it would do
#
# Traefik is the only service that publishes ports (80, 443). It reads the
# running containers through docker-socket-proxy, which alone mounts the
# Docker socket and answers container reads only (KI-214). It terminates
# TLS for CODEFORGE_DOMAIN with a Let's Encrypt certificate (HTTP challenge)
# and routes /api, /health, /ws, /.well-known and /a2a to core-<color> and
# everything else to frontend-<color>; it follows the running containers.
#
# The colored services (profiles "blue" and "green", so a plain `up -d`
# starts neither) extend the prod services from their file and drop their
# published ports (`ports: !reset []` on each service; the Compose tags
# !reset and !override make check-yaml parse this file with --unsafe). Each
# frontend proxies to the core of its own color (CORE_UPSTREAM). Both cores
# carry the network alias "core", which the worker (CODEFORGE_CORE_URL)
# uses; during a switch it resolves to both. The prod "core" and "frontend"
# services are not started (profile "donotstart").

x-core-color: &core-color
  extends:
    file: docker-compose.prod.yml
    service: core
  networks:
    public:
      aliases:
        - core
    internal:
      aliases:
        - core

x-frontend-color: &frontend-color
  extends:
    file: docker-compose.prod.yml
    service: frontend

services:
  # The only service with the Docker socket: an HAProxy that forwards the
  # container and event reads Traefik's provider makes and refuses every
  # other API call (POST, exec, images, volumes). The internet-facing Traefik
  # never holds the socket, so its compromise is not host root (KI-214).
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      # The proxy listens on the internal network only (IPv4).
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker-api

  traefik:
    # v3.6 or later: the Docker provider of older releases speaks API 1.24,
    # which Docker Engine 29 refuses.
    image: traefik:v3.6
    restart: unless-stopped
    # Static configuration as flags: Traefik reads a static configuration file
    # verbatim (no environment expansion), Compose expands these.
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=codeforge-public
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL to the Let's Encrypt account email}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --api.dashboard=false
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Authorization=redact
      - --log.level=INFO
      - --log.format=json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - acme_data:/acme
    # Writes only the ACME volume; binds 80 and 443 without root's other rights.
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - public
      - docker-api

  core-blue:
    <<: *core-color
    # Only Traefik publishes ports. !reset works on the service itself only,
    # not through the merge key above.
    ports: !reset []
    profiles:
      - blue
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core-blue.rule=Host(`${CODEFORGE_DOMAIN:?set CODEFORGE_DOMAIN to the public host name}`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/ws`) || PathPrefix(`/.well-known`) || PathPrefix(`/a2a`))"
      - "traefik.http.routers.core-blue.entrypoints=websecure"
      - "traefik.http.routers.core-blue.tls.certresolver=letsencrypt"
      - "traefik.http.routers.core-blue.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.core-blue.loadbalancer.server.port=8080"
      - "traefik.http.routers.core-blue.priority=20"

  core-green:
    <<: *core-color
    ports: !reset []
    profiles:
      - green
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core-green.rule=Host(`${CODEFORGE_DOMAIN:?set CODEFORGE_DOMAIN to the public host name}`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/ws`) || PathPrefix(`/.well-known`) || PathPrefix(`/a2a`))"
      - "traefik.http.routers.core-green.entrypoints=websecure"
      - "traefik.http.routers.core-green.tls.certresolver=letsencrypt"
      - "traefik.http.routers.core-green.middlewares=rate-limit@file,security-headers@file"
      - "traefik.http.services.core-green.loadbalancer.server.port=8080"
      - "traefik.http.routers.core-green.priority=10"

  frontend-blue:
    <<: *frontend-color
    ports: !reset []
    profiles:
      - blue
    environment:
      CORE_UPSTREAM: core-blue:8080
    depends_on: !override
      core-blue:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-blue.rule=Host(`${CODEFORGE_DOMAIN:?set CODEFORGE_DOMAIN to the public host name}`)"
      - "traefik.http.routers.frontend-blue.entrypoints=websecure"
      - "traefik.http.routers.frontend-blue.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-blue.middlewares=security-headers@file"
      - "traefik.http.services.frontend-blue.loadbalancer.server.port=8080"
      - "traefik.http.routers.frontend-blue.priority=5"

  frontend-green:
    <<: *frontend-color
    ports: !reset []
    profiles:
      - green
    environment:
      CORE_UPSTREAM: core-green:8080
    depends_on: !override
      core-green:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-green.rule=Host(`${CODEFORGE_DOMAIN:?set CODEFORGE_DOMAIN to the public host name}`)"
      - "traefik.http.routers.frontend-green.entrypoints=websecure"
      - "traefik.http.routers.frontend-green.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-green.middlewares=security-headers@file"
      - "traefik.http.services.frontend-green.loadbalancer.server.port=8080"
      - "traefik.http.routers.frontend-green.priority=1"

  # The single-color services of the prod file are replaced by the colors.
  core:
    profiles:
      - donotstart

  frontend:
    profiles:
      - donotstart

networks:
  # A fixed name, so Traefik (--providers.docker.network) reaches the colors
  # on it whatever the Compose project is called.
  public:
    name: codeforge-public
  # Traefik and the Docker socket proxy only; no route out.
  docker-api:
    internal: true

volumes:
  acme_data:
