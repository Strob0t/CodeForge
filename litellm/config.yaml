# LiteLLM Proxy Configuration
# Docs: https://docs.litellm.ai/docs/proxy/configs
#
# Phase 26N: Wildcard routing - provider-level wildcards replace individual
# model entries. The Python worker selects the exact model name via the
# HybridRouter (or scenario-based routing), and LiteLLM routes directly.
#
# When intelligent routing is disabled (CODEFORGE_ROUTING_ENABLED=false),
# workers still use tag-based routing as a fallback. Tags are preserved
# on the wildcard entries for backwards compatibility.
#
# With enable_tag_filtering a request's tag must be among its route's tags
# (LiteLLM answers 401 otherwise): a route that serves agent modes carries
# every scenario tag (llm.SCENARIO_DEFAULTS).
#
# Routes without a key stay configured: a user's own provider key (sent per
# request) works through them. The Core lists the cloud route of a provider
# without a key as one entry ("groq/*"), not the models LiteLLM's catalogue
# expands it to, and a keyed provider's models in full (KI-125). Which keys
# are set reaches the Core and the worker as names only
# (CODEFORGE_LITELLM_KEYED_PROVIDERS, see docker-compose.prod.yml); a route
# added here needs its key variable in both provider maps
# (internal/port/llm/provider_keys.go, workers/codeforge/provider_keys.py).

model_list:
  # -- Local Models (Ollama) --
  # Routed through Ollama's OpenAI-compatible endpoint (/v1), which streams
  # tool calls as structured tool_calls with one index per call (KI-125).
  # LiteLLM's ollama provider (/api/generate) streams them as JSON text, and
  # its ollama_chat provider gives every parallel call index 0.
  # Higher timeout (600s) because local models on consumer hardware are slow.
  # OLLAMA_OPENAI_API_BASE is OLLAMA_BASE_URL plus "/v1", set by both compose
  # files (default: http://host.docker.internal:11434/v1).
  - model_name: "ollama/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "openai/*"
      api_base: "os.environ/OLLAMA_OPENAI_API_BASE"
      api_key: "ollama"  # Ollama ignores it; the openai provider needs a value
      timeout: 600
      tags: ["default", "background", "think", "longContext", "review", "plan"]

  # -- Local Models (LM Studio) --
  # LM Studio exposes an OpenAI-compatible API on port 1234.
  # Use model names like: lm_studio/qwen2.5-coder-32b-instruct
  # Higher timeout (600s) because local models on consumer hardware are slow.
  # Set LM_STUDIO_API_BASE env var to override (e.g. "http://192.168.1.100:1234/v1").
  # Default: host.docker.internal (reachable from Docker Desktop containers).
  - model_name: "lm_studio/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "openai/*"
      api_base: "os.environ/LM_STUDIO_API_BASE"
      api_key: "lm-studio"
      timeout: 600
      tags: ["default", "background", "think", "longContext", "review", "plan"]

  # -- Local Models (LM Studio via OpenAI-compatible alias) --
  # "openai/container" is commonly used in test configs to reference the local LM Studio model.
  # This explicit entry prevents it from matching the openai/* wildcard (which requires OPENAI_API_KEY).
  - model_name: "openai/container"
    litellm_params:
      model: "openai/container"
      api_base: "os.environ/LM_STUDIO_API_BASE"
      api_key: "lm-studio"
      timeout: 600
      tags: ["default", "background", "think", "longContext", "review", "plan"]

  # -- OpenAI --
  - model_name: "openai/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "openai/*"
      api_key: "os.environ/OPENAI_API_KEY"

  # -- Anthropic --
  - model_name: "anthropic/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "anthropic/*"
      api_key: "os.environ/ANTHROPIC_API_KEY"

  # -- Google Gemini --
  - model_name: "gemini/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "gemini/*"
      api_key: "os.environ/GEMINI_API_KEY"

  # -- Groq (fast inference) --
  - model_name: "groq/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "groq/*"
      api_key: "os.environ/GROQ_API_KEY"
      tags: ["default", "background", "think", "longContext", "review", "plan"]

  # -- Mistral AI --
  - model_name: "mistral/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "mistral/*"
      api_key: "os.environ/MISTRAL_API_KEY"
      tags: ["default", "background", "think", "longContext", "review", "plan"]

  # -- OpenRouter --
  - model_name: "openrouter/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "openrouter/*"
      api_key: "os.environ/OPENROUTER_API_KEY"
      tags: ["default", "background", "think", "longContext", "review", "plan"]

  # -- Cerebras (fast inference) --
  - model_name: "cerebras/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "cerebras/*"
      api_key: "os.environ/CEREBRAS_API_KEY"
      tags: ["default", "background", "think", "longContext", "review", "plan"]

  # -- GitHub Copilot --
  # Disabled: device-code auth blocks LiteLLM startup synchronously.
  # Copilot token exchange is handled by Go Core (internal/adapter/copilot/client.go).
  # - model_name: "github_copilot/*"
  #   litellm_params:
  #     model: "github_copilot/*"
  #     extra_headers:
  #       Editor-Version: "vscode/1.88.0"
  #       Copilot-Integration-Id: "vscode-chat"

  # -- Chutes (OpenAI-compatible) --
  - model_name: "chutes/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "openai/*"
      api_base: "https://llm.chutes.ai/v1"
      api_key: "os.environ/CHUTES_API_KEY"

  # -- AihubMix (OpenAI-compatible) --
  - model_name: "aihubmix/*"
    model_info:
      disable_background_health_check: true
    litellm_params:
      model: "openai/*"
      api_base: "https://aihubmix.com/v1"
      api_key: "os.environ/AIHUBMIX_API_KEY"

router_settings:
  enable_tag_filtering: true
  # Reduced from 2: app-level retry in llm.py handles remaining retries
  num_retries: 1

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 120
  # Reduced from 2: app-level retry in llm.py handles remaining retries
  num_retries: 1
  # Query actual provider endpoints for wildcard model discovery.
  # Without this, LiteLLM expands wildcards from its internal model cost map,
  # showing hundreds of phantom models that providers don't actually offer.
  check_provider_endpoint: true

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  # /health skips the routes marked disable_background_health_check (KI-130):
  # for a wildcard route LiteLLM probes a random cheap model of the provider's
  # catalogue (gpt-5-nano for an OpenAI-compatible local server), which fails
  # on local servers and without a key and says nothing about the models in
  # use. The Core and the worker call /health on every model refresh.
  health_check_skip_disabled_background_models: true
