# Prometheus alert rules for a CodeForge host. CodeForge itself exports no
# Prometheus metrics (and ships no Prometheus service): these rules need
# cAdvisor (container_*), node_exporter (node_*) and blackbox_exporter
# (probe_*, e.g. probing /health and the HTTPS endpoint). Rules on
# application metrics nothing exported (http_requests_total,
# http_request_duration_seconds, nats_consumer_pending, nats_stream_bytes)
# were removed (KI-214). Disk alerts matter most for a self-hosted install:
# PostgreSQL stops when its volume fills.
groups:
  - name: codeforge
    rules:
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} memory usage > 90%"

      - alert: HealthCheckFailing
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Health check failing for {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"}
          / node_filesystem_size_bytes < 0.10)
          and node_filesystem_readonly == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk space below 10% on {{ $labels.mountpoint }}"

      - alert: DiskFillPrediction
        expr: |
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"}[3h],
            86400
          ) <= 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Disk predicted to fill within 24h on {{ $labels.mountpoint }}"

      - alert: SSLCertExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 20
          and (probe_ssl_earliest_cert_expiry - time()) / 86400 > 0
        labels:
          severity: warning
        annotations:
          summary: "SSL cert for {{ $labels.instance }} expires in {{ $value | humanize }} days"
