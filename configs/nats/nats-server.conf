# NATS server configuration of docker-compose.prod.yml (KI-71).
#
# Every client authenticates. The Go Core connects as "core", the Python
# worker as "worker", each with its own password from the secret file
# passwords.conf (generated by scripts/generate-secrets.sh, mounted next to
# this file), and each may publish only what it publishes. Agent tool
# processes run as another user and cannot read the worker's credentials, so
# they cannot connect at all; a worker cannot forge what only the Go Core
# sends (run starts, cancels, tool-call decisions, task dispatches).
#
# Keep the lists in step with internal/port/messagequeue/queue.go and
# workers/codeforge/nats_subjects.py: a subject a service publishes but its
# user may not is refused by the server (workers/tests/test_nats_permissions.py
# and internal/adapter/nats/auth_test.go check the lists against a real server).

include "passwords.conf"

authorization {
  users: [
    {
      # The Go Core owns the CODEFORGE stream and the KV buckets and publishes
      # on every stream subject (dispatches, cancels, decisions, events,
      # released quarantined messages).
      user: "core"
      password: $CORE_PASSWORD
      permissions: {
        publish: {
          allow: [
            "tasks.>", "agents.>", "runs.>", "context.>", "repomap.>", "retrieval.>", "graph.>",
            "conversation.>", "evaluation.>", "benchmark.>", "mcp.>", "a2a.>", "memory.>",
            "handoff.>", "backends.>", "prompt.>",
            "$JS.API.>", "$JS.ACK.>", "$JS.FC.>", "$KV.>"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      # The worker publishes results, progress and dead-letter copies of what
      # it consumes, and manages its own consumers on the CODEFORGE stream.
      user: "worker"
      password: $WORKER_PASSWORD
      permissions: {
        publish: {
          allow: [
            # Results, output and heartbeats (worker -> Go Core)
            "tasks.result", "tasks.output", "tasks.heartbeat", "agents.output",
            "runs.complete", "runs.output", "runs.heartbeat", "runs.toolcall.request",
            "runs.toolcall.result", "runs.trajectory.event", "runs.qualitygate.result",
            "repomap.generate.result", "retrieval.index.result", "retrieval.search.result",
            "retrieval.subagent.result", "graph.build.result", "graph.search.result",
            "context.rerank.result", "conversation.run.complete", "conversation.compact.complete",
            "conversation.test.result", "benchmark.run.result", "benchmark.task.started",
            "benchmark.task.progress", "evaluation.gemmas.result", "memory.recall.result",
            "a2a.task.complete", "handoff.request", "backends.health.result",
            "prompt.evolution.reflect.complete", "prompt.evolution.mutate.complete",

            # Dead-letter copies of the subjects the worker consumes (ADR-016)
            "tasks.agent.*.dlq", "runs.start.dlq", "runs.qualitygate.request.dlq",
            "conversation.test.request.dlq", "repomap.generate.request.dlq",
            "retrieval.index.request.dlq", "retrieval.search.request.dlq",
            "retrieval.subagent.request.dlq", "graph.build.request.dlq", "graph.search.request.dlq",
            "context.rerank.request.dlq", "conversation.run.start.dlq",
            "conversation.compact.request.dlq", "benchmark.run.request.dlq",
            "evaluation.gemmas.request.dlq", "memory.store.dlq", "memory.recall.dlq",
            "a2a.task.created.dlq", "a2a.task.cancel.dlq", "backends.health.request.dlq",
            "prompt.evolution.reflect.dlq", "prompt.evolution.promoted.dlq",
            "prompt.evolution.reverted.dlq", "context.shared.updated.dlq",

            # JetStream: its own consumers on CODEFORGE (no stream changes, no KV)
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.CODEFORGE",
            "$JS.API.CONSUMER.CREATE.CODEFORGE", "$JS.API.CONSUMER.CREATE.CODEFORGE.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.CODEFORGE.>", "$JS.API.CONSUMER.INFO.CODEFORGE.>",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.>", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.>",
            "$JS.ACK.CODEFORGE.>", "$JS.FC.CODEFORGE.>"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
