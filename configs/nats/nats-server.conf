# NATS server configuration of docker-compose.prod.yml (KI-71).
#
# Every client authenticates. The Go Core connects as "core", the Python
# worker as "worker", each with its own password from the secret file
# passwords.conf (generated by scripts/generate-secrets.sh, mounted next to
# this file), and each may publish only what it publishes. Agent tool
# processes run as another user and cannot read the worker's credentials, so
# they cannot connect at all; a worker cannot forge what only the Go Core
# sends (run starts, cancels, tool-call decisions, task dispatches).
#
# Keep the lists in step with internal/port/messagequeue/queue.go and
# workers/codeforge/nats_subjects.py: a subject a service publishes but its
# user may not is refused by the server (workers/tests/test_nats_permissions.py
# and internal/adapter/nats/auth_test.go check the lists against a real server).
#
# The server does not check the deliver subject of a push consumer, nor the
# reply subject of a pull request, against the creator's publish rights: a
# consumer can deliver stream messages to any plain subscription (a delivery
# onto a stream subject is refused as a cycle and nothing is stored). Each
# service therefore has inboxes of its own (_INBOX_core / _INBOX_worker, set
# by the clients) that only it may subscribe to, so the worker cannot learn
# the Go Core's inbox names; and the worker may use only its own consumers
# (durables and notification consumers, all named codeforge-py-*).

include "passwords.conf"

authorization {
  users: [
    {
      # The Go Core owns the CODEFORGE stream and the KV buckets and publishes
      # on every stream subject (dispatches, cancels, decisions, events,
      # released quarantined messages). Its replicas hand results and
      # decisions to the one that waits for them on core.relay.* (core NATS
      # request-reply, KI-86): only this user may use those subjects, and it
      # answers a relay request on the requester's reply inbox
      # (allow_responses).
      user: "core"
      password: $CORE_PASSWORD
      permissions: {
        publish: {
          allow: [
            "tasks.>", "agents.>", "runs.>", "context.>", "repomap.>", "retrieval.>", "graph.>",
            "conversation.>", "evaluation.>", "benchmark.>", "mcp.>", "a2a.>", "memory.>",
            "handoff.>", "backends.>", "prompt.>", "workspace.>", "core.relay.>",
            "$JS.API.>", "$JS.ACK.>", "$JS.FC.>", "$KV.>"
          ]
        }
        subscribe: { allow: ["_INBOX_core.>", "core.relay.>"] }
        allow_responses: true
      }
    }
    {
      # The worker publishes results, progress and dead-letter copies of what
      # it consumes, and manages its own consumers on the CODEFORGE stream.
      user: "worker"
      password: $WORKER_PASSWORD
      permissions: {
        publish: {
          allow: [
            # Results, output and heartbeats (worker -> Go Core)
            "tasks.result", "tasks.output", "tasks.heartbeat", "agents.output",
            "runs.complete", "runs.output", "runs.heartbeat", "runs.toolcall.request",
            "runs.toolcall.result", "runs.trajectory.event", "runs.qualitygate.result",
            "repomap.generate.result", "retrieval.index.result", "retrieval.search.result",
            "retrieval.subagent.result", "graph.build.result", "graph.search.result",
            "context.rerank.result", "conversation.run.complete", "conversation.compact.complete",
            "conversation.test.result", "benchmark.run.result", "benchmark.task.started",
            "benchmark.task.progress", "evaluation.gemmas.result", "memory.recall.result",
            "a2a.task.complete", "handoff.request", "backends.health.result",
            "prompt.evolution.reflect.complete", "prompt.evolution.mutate.complete",
            "workspace.delete.result",

            # Dead-letter copies of the subjects the worker consumes (ADR-016)
            "tasks.agent.*.dlq", "runs.start.dlq", "runs.qualitygate.request.dlq",
            "conversation.test.request.dlq", "repomap.generate.request.dlq",
            "retrieval.index.request.dlq", "retrieval.search.request.dlq",
            "retrieval.subagent.request.dlq", "graph.build.request.dlq", "graph.search.request.dlq",
            "context.rerank.request.dlq", "conversation.run.start.dlq",
            "conversation.compact.request.dlq", "benchmark.run.request.dlq",
            "evaluation.gemmas.request.dlq", "memory.store.dlq", "memory.recall.dlq",
            "a2a.task.created.dlq", "a2a.task.cancel.dlq", "backends.health.request.dlq",
            "prompt.evolution.reflect.dlq", "prompt.evolution.promoted.dlq",
            "prompt.evolution.reverted.dlq", "context.shared.updated.dlq",
            "workspace.delete.request.dlq",

            # JetStream: no stream changes, no KV, none of the Go Core's
            # consumers. Consumers are created only through the API subject
            # that carries their name (the server refuses another name in the
            # request); the subject without a name would let the worker
            # create or reconfigure any consumer, the Go Core's included.
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.CODEFORGE",
            # Notifications (codeforge.notifications): one push consumer per
            # subject, shared by the worker instances (create, read its
            # settings; never delete), never acked, and reading the stream back
            # by subject with batched direct gets, so a run or task sees the
            # cancels published since its start and nothing is lost while an
            # instance was away.
            "$JS.API.DIRECT.GET.CODEFORGE",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-notify-runs-cancel.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-notify-runs-cancel",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-notify-tasks-cancel.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-notify-tasks-cancel",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-notify-conversation-run-cancel.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-notify-conversation-run-cancel",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-notify-runs-toolcall-response.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-notify-runs-toolcall-response",
            # Its own durables (codeforge.nats_subjects.consumer_name of each
            # subject it consumes): create/update, info, delete, fetch, ack.
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-tasks-agent-all.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-tasks-agent-all",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-tasks-agent-all", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-tasks-agent-all", "$JS.ACK.CODEFORGE.codeforge-py-tasks-agent-all.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-runs-start.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-runs-start",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-runs-start", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-runs-start", "$JS.ACK.CODEFORGE.codeforge-py-runs-start.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-runs-qualitygate-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-runs-qualitygate-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-runs-qualitygate-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-runs-qualitygate-request", "$JS.ACK.CODEFORGE.codeforge-py-runs-qualitygate-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-conversation-test-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-conversation-test-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-conversation-test-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-conversation-test-request", "$JS.ACK.CODEFORGE.codeforge-py-conversation-test-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-workspace-delete-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-workspace-delete-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-workspace-delete-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-workspace-delete-request", "$JS.ACK.CODEFORGE.codeforge-py-workspace-delete-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-repomap-generate-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-repomap-generate-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-repomap-generate-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-repomap-generate-request", "$JS.ACK.CODEFORGE.codeforge-py-repomap-generate-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-retrieval-index-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-retrieval-index-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-retrieval-index-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-retrieval-index-request", "$JS.ACK.CODEFORGE.codeforge-py-retrieval-index-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-retrieval-search-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-retrieval-search-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-retrieval-search-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-retrieval-search-request", "$JS.ACK.CODEFORGE.codeforge-py-retrieval-search-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-retrieval-subagent-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-retrieval-subagent-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-retrieval-subagent-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-retrieval-subagent-request", "$JS.ACK.CODEFORGE.codeforge-py-retrieval-subagent-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-graph-build-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-graph-build-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-graph-build-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-graph-build-request", "$JS.ACK.CODEFORGE.codeforge-py-graph-build-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-graph-search-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-graph-search-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-graph-search-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-graph-search-request", "$JS.ACK.CODEFORGE.codeforge-py-graph-search-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-context-rerank-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-context-rerank-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-context-rerank-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-context-rerank-request", "$JS.ACK.CODEFORGE.codeforge-py-context-rerank-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-conversation-run-start.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-conversation-run-start",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-conversation-run-start", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-conversation-run-start", "$JS.ACK.CODEFORGE.codeforge-py-conversation-run-start.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-conversation-compact-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-conversation-compact-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-conversation-compact-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-conversation-compact-request", "$JS.ACK.CODEFORGE.codeforge-py-conversation-compact-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-benchmark-run-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-benchmark-run-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-benchmark-run-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-benchmark-run-request", "$JS.ACK.CODEFORGE.codeforge-py-benchmark-run-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-evaluation-gemmas-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-evaluation-gemmas-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-evaluation-gemmas-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-evaluation-gemmas-request", "$JS.ACK.CODEFORGE.codeforge-py-evaluation-gemmas-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-memory-store.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-memory-store",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-memory-store", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-memory-store", "$JS.ACK.CODEFORGE.codeforge-py-memory-store.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-memory-recall.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-memory-recall",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-memory-recall", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-memory-recall", "$JS.ACK.CODEFORGE.codeforge-py-memory-recall.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-a2a-task-created.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-a2a-task-created",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-a2a-task-created", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-a2a-task-created", "$JS.ACK.CODEFORGE.codeforge-py-a2a-task-created.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-a2a-task-cancel.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-a2a-task-cancel",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-a2a-task-cancel", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-a2a-task-cancel", "$JS.ACK.CODEFORGE.codeforge-py-a2a-task-cancel.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-backends-health-request.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-backends-health-request",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-backends-health-request", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-backends-health-request", "$JS.ACK.CODEFORGE.codeforge-py-backends-health-request.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-prompt-evolution-reflect.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-prompt-evolution-reflect",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-prompt-evolution-reflect", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-prompt-evolution-reflect", "$JS.ACK.CODEFORGE.codeforge-py-prompt-evolution-reflect.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-prompt-evolution-promoted.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-prompt-evolution-promoted",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-prompt-evolution-promoted", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-prompt-evolution-promoted", "$JS.ACK.CODEFORGE.codeforge-py-prompt-evolution-promoted.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-prompt-evolution-reverted.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-prompt-evolution-reverted",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-prompt-evolution-reverted", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-prompt-evolution-reverted", "$JS.ACK.CODEFORGE.codeforge-py-prompt-evolution-reverted.>",
            "$JS.API.CONSUMER.CREATE.CODEFORGE.codeforge-py-context-shared-updated.>", "$JS.API.CONSUMER.INFO.CODEFORGE.codeforge-py-context-shared-updated",
            "$JS.API.CONSUMER.DELETE.CODEFORGE.codeforge-py-context-shared-updated", "$JS.API.CONSUMER.MSG.NEXT.CODEFORGE.codeforge-py-context-shared-updated", "$JS.ACK.CODEFORGE.codeforge-py-context-shared-updated.>"
          ]
        }
        subscribe: { allow: ["_INBOX_worker.>"] }
      }
    }
  ]
}
