x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

# Published ports bind to 127.0.0.1 only: these dev services run without
# authentication or with default credentials (PostgreSQL password, NATS,
# LiteLLM dev master key, Jaeger, docs-mcp, playwright-mcp). Containers and
# the devcontainer reach them by container name on the codeforge network.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.67
    container_name: codeforge-jaeger
    logging: *default-logging
    profiles:
      - dev
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - codeforge

  playwright-mcp:
    image: mcp/playwright:latest
    container_name: codeforge-playwright
    logging: *default-logging
    profiles:
      - dev
    # Its own IPC namespace (the browser loads arbitrary sites); shm_size
    # gives Chromium its shared memory (KI-214).
    shm_size: "1gb"
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - codeforge
    command:
      - "--browser"
      - "chromium"
      - "--isolated"
      - "--headless"
      - "--port"
      - "8001"
      - "--host"
      - "0.0.0.0"
      - "--allowed-hosts"
      - "*"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:8001/mcp').catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    image: postgres:18-alpine
    container_name: codeforge-postgres
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: codeforge
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeforge_dev}
    # PostgreSQL 18+ images keep PGDATA in /var/lib/postgresql/18/docker and
    # refuse to start with a mount at /var/lib/postgresql/data: mount the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=384MB
        -c max_connections=100
        -c log_line_prefix='%t [%p] %q%u@%d '
        -c wal_level=replica
        -c archive_mode=on
        -c archive_command='mkdir -p /var/lib/postgresql/archive && test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U codeforge" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - codeforge
    deploy:
      resources:
        limits:
          memory: 1G

  nats:
    image: nats:2-alpine
    container_name: codeforge-nats
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: [ "--jetstream", "--store_dir", "/data", "-m", "8222" ]
    volumes:
      - nats_data:/data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - codeforge
    deploy:
      resources:
        limits:
          memory: 512M

  docs-mcp:
    image: ghcr.io/arabold/docs-mcp-server:latest
    container_name: codeforge-docs-mcp
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:6280:6280"
      - "127.0.0.1:6281:6281"
    # Embeddings via an OpenAI-compatible API (LM Studio by default); set the
    # DOCS_MCP_* variables in .env to use another server or model.
    environment:
      OPENAI_API_KEY: ${DOCS_MCP_API_KEY:-lm-studio}
      OPENAI_API_BASE: ${DOCS_MCP_API_BASE:-http://host.docker.internal:1234/v1}
      DOCS_MCP_EMBEDDING_MODEL: ${DOCS_MCP_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
    # The default API base is on the host; Linux needs the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - docs_mcp_data:/data
      - docs_mcp_config:/config
    command: [ "mcp", "--protocol", "http", "--host", "0.0.0.0", "--port", "6280", "--no-logo" ]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:6281" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codeforge

  litellm:
    # The release production runs (docker-compose.prod.yml, KI-214).
    image: ghcr.io/berriai/litellm:v1.103.1
    container_name: codeforge-litellm
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-codeforge-dev}
      DATABASE_URL: postgresql://codeforge:${POSTGRES_PASSWORD:-codeforge_dev}@postgres:5432/codeforge
      # ollama/* goes to Ollama's OpenAI-compatible /v1 endpoint (KI-125);
      # OLLAMA_API_BASE lets LiteLLM read a model's capabilities from Ollama.
      OLLAMA_OPENAI_API_BASE: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}/v1
      OLLAMA_API_BASE: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CHUTES_API_KEY: ${CHUTES_API_KEY:-}
      AIHUBMIX_API_KEY: ${AIHUBMIX_API_KEY:-}
      LM_STUDIO_API_BASE: ${LM_STUDIO_API_BASE:-http://host.docker.internal:1234/v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: codeforge-litellm
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    # Ollama and LM Studio default to the host; Linux needs the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_PROJECT_PATH:-.}/litellm:/app/data
    command: [ "--config", "/app/data/config.yaml", "--port", "4000" ]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - codeforge
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
    name: codeforge-pgdata
  nats_data:
    name: codeforge-nats-data
  docs_mcp_data:
    name: codeforge-docs-mcp-data
  docs_mcp_config:
    name: codeforge-docs-mcp-config

networks:
  codeforge:
    driver: bridge
    name: codeforge
