# Serena project configuration for the serena MCP server in .mcp.json (trial).
# Generated by `serena project create` (serena-agent 1.7.0), with the template
# comments shortened. Keep every key: Serena rewrites this file with its full
# template when a key is missing, so after a serena-agent upgrade start the
# server once and commit the keys it adds (keep the file ASCII only).
# Key reference: https://oraios.github.io/serena/02-usage/050_configuration.html
project_name: "CodeForge"

# Serena auto-detects only Go in this repo, so all three code languages are
# declared. The first entry is the fallback for files no other server claims.
# Go needs gopls on PATH (installed by .claude/hooks/session-start.sh); Serena
# downloads the Python (pyright) and TypeScript servers on first use.
language_servers:
  - go
  - python
  - typescript

encoding: "utf-8"
ignore_all_files_in_gitignore: true

# Trial scope: symbol navigation only. Files are edited with Claude Code's own
# tools, so Serena's editing tools stay off even under another context.
read_only: true

# Empty or null below means Serena's default or the global configuration.
default_modes:
added_modes:
excluded_tools: []
included_optional_tools: []
fixed_tools: []
symbol_info_budget:
language_backend:
line_ending:
read_only_memory_patterns: []
ignored_memory_patterns: []
ls_specific_settings: {}
ignored_paths: []
ls_workspace_folders:
  - .
ls_additional_workspace_folders: []
initial_prompt: ""
activation_command:
activation_command_timeout: 180.0
